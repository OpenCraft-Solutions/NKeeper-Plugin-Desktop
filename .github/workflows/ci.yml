name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: jobs only read the repository, and the packages their own token can read.
permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # NKeeper's SDK, plugin build and test helpers come from GitHub Packages, which needs a token even for public
  # packages. nuget.config and frontend/.npmrc read these; nothing is written to disk.
  NUGET_USERNAME: ${{ github.actor }}
  NUGET_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  frontend:
    name: Frontend
    runs-on: [self-hosted, nkeeper]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (from the lock file)
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type-check
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build

  backend:
    name: Backend, tests and package
    runs-on: [self-hosted, nkeeper]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # Building the plugin builds its frontend, so the backend build needs the npm packages too.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Restore, build and pack are one step each; the package is signed with a development key that NKeeper.Plugin.Build
      # makes fresh for this run (plugin-security.md §6.1, §10). Only a release signs with the official key.
      - name: Restore
        run: dotnet restore NKeeper.Plugins.Desktop.slnx

      - name: Check formatting
        run: dotnet format NKeeper.Plugins.Desktop.slnx --verify-no-changes --no-restore

      - name: Build and pack
        run: dotnet build NKeeper.Plugins.Desktop.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test NKeeper.Plugins.Desktop.slnx --no-build --configuration Release

      - name: Check the package
        run: |
          shopt -s nullglob
          packages=(artifacts/plugins/desktop-*.nkp)
          if [ ${#packages[@]} -ne 1 ]; then echo "Expected one desktop package, found ${#packages[@]}." >&2; exit 1; fi
          ls -l "${packages[@]}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-development-package
          path: artifacts/plugins/desktop-*.nkp
          if-no-files-found: error
          retention-days: 7
